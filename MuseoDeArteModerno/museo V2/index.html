<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Museo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="juego">
    <canvas id="pantalla"></canvas>
    <div id="mira">+</div>
    <div id="titulo"></div>
    <div id="sala"></div>
    <div id="pista"></div>
    <div id="ayuda"></div>
    <div id="giro">Gira el dispositivo en horizontal para jugar mejor</div>
    <div id="tactil" hidden>
      <div id="joy"><div id="knob"></div></div>
      <div id="b-top"><button id="b-mapa">Mapa</button><button id="b-son">🔊</button><button id="b-full">⛶</button></div>
      <button id="b-act">Interactuar</button>
    </div>
    <div id="mapa-ui" hidden>
      <button class="cerrar" id="m-cerrar">✕</button>
      <h2 id="m-titulo"></h2>
      <canvas id="m-canvas" width="640" height="384"></canvas>
      <div id="m-tabs"></div>
      <small>← / → o 1-4 para cambiar de piso · [M] cerrar</small>
    </div>
    <div id="panel" hidden>
      <button class="cerrar" id="p-cerrar">✕</button>
      <h2 id="p-titulo"></h2>
      <h3 id="p-sub"></h3>
      <img id="p-img" alt="">
      <p id="p-texto"></p>
      <div id="p-botones"></div>
      <small>[E] / [Esc] para cerrar</small>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/obras.js"></script>
  <script src="js/nivel.js"></script>
  <script src="js/motor.js"></script>
</body>
</html>
