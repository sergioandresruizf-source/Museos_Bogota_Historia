<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Museo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="juego">
    <canvas id="pantalla"></canvas>
    <div id="mira">+</div>
    <div id="titulo"></div>
    <div id="sala"></div>
    <div id="pista"></div>
    <div id="ayuda"></div>
    <div id="mapa-ui" hidden>
      <h2 id="m-titulo"></h2>
      <canvas id="m-canvas" width="640" height="384"></canvas>
      <div id="m-tabs"></div>
      <small>← / → o 1-4 para cambiar de piso · [M] cerrar</small>
    </div>
    <div id="panel" hidden>
      <h2 id="p-titulo"></h2>
      <h3 id="p-sub"></h3>
      <img id="p-img" alt="">
      <p id="p-texto"></p>
      <div id="p-botones"></div>
      <small>[E] / [Esc] para cerrar</small>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/obras.js"></script>
  <script src="js/nivel.js"></script>
  <script src="js/motor.js"></script>
</body>
</html>
