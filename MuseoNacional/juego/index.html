<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Islas de la Contrarrevolución</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --px:'Press Start 2P','Courier New',monospace;
  --txt:'Courier New',Courier,monospace;
  --ink:#1b1a24; --wood:#6b4426; --wood2:#8a5a35; --gold:#f0c24a; --paper:#f4e6c3; --red:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1522;color:#fff;overflow:hidden;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:env(safe-area-inset-top,0px)}
#stageBox{flex:1 1 auto;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:4/3;width:min(100vw,calc((100vh - var(--padH,0px)) * 4 / 3));
  max-height:calc(100vh - var(--padH,0px));background:#000;overflow:hidden;
  box-shadow:0 0 0 3px #000,0 0 0 6px #3a2a1a}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ---- HUD (todo en unidades relativas al ancho del escenario: --u) ---- */
#stage{--u:1px}
.box{background:rgba(27,26,36,.86);border:calc(var(--u)*1.5) solid #f0c24a;
  box-shadow:0 0 0 calc(var(--u)*1) #000, calc(var(--u)*2) calc(var(--u)*2) 0 rgba(0,0,0,.5);
  font-family:var(--px);color:#fff;line-height:1.5}
#hud{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*6);padding:calc(var(--u)*4) calc(var(--u)*6);
  font-size:calc(var(--u)*6.4);display:none}
#hud .n{color:var(--gold)}
#hud .p{display:block;font-size:calc(var(--u)*5);color:#bcd;margin-top:calc(var(--u)*2);max-width:calc(var(--u)*200);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*6);width:calc(var(--u)*50);height:calc(var(--u)*61);
  border:calc(var(--u)*1.5) solid #f0c24a;box-shadow:0 0 0 calc(var(--u)*1) #000;image-rendering:pixelated;display:none;background:#1d5f8f}
#prompt{position:absolute;left:50%;bottom:calc(var(--u)*10);transform:translateX(-50%);padding:calc(var(--u)*4) calc(var(--u)*8);
  font-size:calc(var(--u)*6);display:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;text-align:center}
#toast{position:absolute;left:50%;top:calc(var(--u)*34);transform:translateX(-50%);padding:calc(var(--u)*5) calc(var(--u)*9);
  font-size:calc(var(--u)*6);display:none;text-align:center;max-width:92%;border-color:#fff}
#caption{position:absolute;left:50%;bottom:calc(var(--u)*12);transform:translateX(-50%);padding:calc(var(--u)*6) calc(var(--u)*10);
  font-size:calc(var(--u)*7);display:none;text-align:center;max-width:92%}
#sign{position:absolute;left:37%;top:22.2%;width:26%;height:6.8%;display:none;align-items:center;justify-content:center;
  font-family:var(--px);color:#ffe9a8;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #2a1608;text-align:center;
  white-space:pre;overflow:hidden;pointer-events:none;line-height:1.2}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s steps(6)}

/* ---- Pantalla de título ---- */
#title{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:linear-gradient(rgba(6,14,28,.55),rgba(6,14,28,.78));padding:calc(var(--u)*8)}
#title h1{font-family:var(--px);font-size:calc(var(--u)*14);margin:0 0 calc(var(--u)*5);color:var(--gold);line-height:1.35;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #000,0 0 calc(var(--u)*10) #000}
#title .sub{font-family:var(--txt);font-weight:bold;font-size:calc(var(--u)*8);margin:0 0 calc(var(--u)*12);color:#e9f3ff;max-width:90%}
.btn{font-family:var(--px);font-size:calc(var(--u)*7);color:#1b1a24;background:var(--gold);border:0;cursor:pointer;
  padding:calc(var(--u)*5) calc(var(--u)*10);margin:calc(var(--u)*3);
  box-shadow:inset calc(var(--u)*-2) calc(var(--u)*-2) 0 #b8862a,inset calc(var(--u)*2) calc(var(--u)*2) 0 #ffe08a,0 0 0 calc(var(--u)*1.5) #000}
.btn:active{transform:translateY(calc(var(--u)*1))}
.btn.alt{background:#cfd6e4;box-shadow:inset calc(var(--u)*-2) calc(var(--u)*-2) 0 #8d96a8,inset calc(var(--u)*2) calc(var(--u)*2) 0 #fff,0 0 0 calc(var(--u)*1.5) #000}
#title .help{font-family:var(--txt);font-size:calc(var(--u)*6.5);margin-top:calc(var(--u)*9);color:#cfe0f5;line-height:1.5;font-weight:bold}

/* ---- Diálogo de obra ---- */
#dialog{position:absolute;inset:calc(var(--u)*8);display:none;flex-direction:column;
  background:#4b4f5c;border:calc(var(--u)*3) solid #20222b;
  box-shadow:0 0 0 calc(var(--u)*1.5) #000,0 0 0 calc(var(--u)*100) rgba(0,0,0,.55);
  background-image:
    linear-gradient(#2c2e38 calc(var(--u)*1),transparent calc(var(--u)*1)),
    linear-gradient(90deg,#2c2e38 calc(var(--u)*1),transparent calc(var(--u)*1));
  background-size:calc(var(--u)*24) calc(var(--u)*12);padding:calc(var(--u)*6);color:#fff;overflow:hidden}
#dialog .top{display:flex;gap:calc(var(--u)*8);align-items:flex-start;min-height:0;flex:1 1 auto;overflow:hidden}
#dlgImgWrap{flex:0 0 42%;aspect-ratio:1/1;max-height:100%;background:#000;border:calc(var(--u)*3) solid #b8863b;
  box-shadow:0 0 0 calc(var(--u)*1) #000;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#dlgImgWrap img{width:100%;height:100%;object-fit:contain;image-rendering:auto;display:block;background:#000}
#dlgImgWrap.escultura{background:radial-gradient(circle at 50% 40%,#4a4f66,#14151d)}
#dlgImgWrap.escultura img{background:transparent}
#dlgImgWrap .ph{font-family:var(--px);font-size:calc(var(--u)*5);text-align:center;padding:calc(var(--u)*4);color:#9aa;line-height:1.7}
#dlgImgWrap.removed{background:repeating-linear-gradient(115deg,#0a0a0a 0 calc(var(--u)*3),#1a1a1a calc(var(--u)*3) calc(var(--u)*6));border-style:dashed;border-color:#888}
#dlgImgWrap.removed .ph{color:#d77}
#dlgText{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
#dlgBadge{align-self:flex-start;font-family:var(--px);font-size:calc(var(--u)*4.6);padding:calc(var(--u)*2.5) calc(var(--u)*4);margin-bottom:calc(var(--u)*4);background:#2f8f4e;color:#fff}
#dlgBadge.removed{background:#b3302a}
#dlgTitle{font-family:var(--px);font-size:calc(var(--u)*7.4);color:var(--gold);line-height:1.5;margin:0 0 calc(var(--u)*4);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000}
#dlgOrigin{font-family:var(--txt);font-weight:bold;font-size:calc(var(--u)*6);color:#9fd3ff;margin:0 0 calc(var(--u)*3)}
#dlgDesc{font-family:var(--txt);font-weight:bold;font-size:calc(var(--u)*7);line-height:1.45;overflow:auto;background:rgba(0,0,0,.35);padding:calc(var(--u)*5);flex:1 1 auto;min-height:0}
#dialog .bottom{display:flex;justify-content:flex-end;margin-top:calc(var(--u)*5)}

/* ---- Puzzles ---- */
#puzzle{position:absolute;inset:calc(var(--u)*8);display:none;flex-direction:column;background:#2a2c38;border:calc(var(--u)*3) solid #20222b;
  box-shadow:0 0 0 calc(var(--u)*1.5) #000,0 0 0 calc(var(--u)*100) rgba(0,0,0,.62);padding:calc(var(--u)*6);color:#fff;
  background-image:linear-gradient(#22242e calc(var(--u)*1),transparent calc(var(--u)*1)),linear-gradient(90deg,#22242e calc(var(--u)*1),transparent calc(var(--u)*1));background-size:calc(var(--u)*16) calc(var(--u)*16)}
#pzTitle{font-family:var(--px);font-size:calc(var(--u)*6.6);color:var(--gold);margin:0 0 calc(var(--u)*3);line-height:1.4;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000}
#pzHelp{font-family:var(--txt);font-weight:bold;font-size:calc(var(--u)*6.4);margin:0 0 calc(var(--u)*3);line-height:1.35;color:#dfe8f5}
#pzArea{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);flex-wrap:wrap}
.pzbot{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*4);margin-top:calc(var(--u)*3);min-height:calc(var(--u)*14)}
#pzMsg{font-family:var(--px);font-size:calc(var(--u)*5.2);color:#9fd3ff;line-height:1.5}
.pzbtn:active{transform:translateY(calc(var(--u)*1))}

/* ---- Final ---- */
#finale{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:rgba(5,10,22,.72);padding:calc(var(--u)*10)}
#finale h2{font-family:var(--px);font-size:calc(var(--u)*11);color:var(--gold);margin:0 0 calc(var(--u)*8);line-height:1.4;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #000}
#finale p{font-family:var(--txt);font-weight:bold;font-size:calc(var(--u)*8);max-width:84%;margin:0 0 calc(var(--u)*10);line-height:1.5}
#btnSkip{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*6);display:none;font-size:calc(var(--u)*5.5);padding:calc(var(--u)*3) calc(var(--u)*6)}
#btnMute{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*6);width:calc(var(--u)*16);height:calc(var(--u)*16);padding:0;font-size:calc(var(--u)*6);opacity:.85;display:none;margin:0}

/* ---- Controles táctiles ---- */
#pad{flex:0 0 auto;width:100%;height:var(--padH,0px);display:none;position:relative;background:#16110c;
  border-top:3px solid #3a2a1a;padding-bottom:env(safe-area-inset-bottom,0px)}
body.touch #pad{display:block}
#joy{position:absolute;left:5%;top:50%;transform:translateY(-50%);width:min(34vw,150px);height:min(34vw,150px);border-radius:50%;
  background:radial-gradient(circle,#3a2a1a 0 35%,#241810 36% 100%);border:3px solid #6b4426;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
  background:#d8a642;border:3px solid #fff3c0;box-shadow:0 3px 0 #7a5614}
.abtn{position:absolute;top:50%;width:min(22vw,92px);height:min(22vw,92px);border-radius:50%;border:4px solid #fff;
  font-family:var(--px);font-size:min(7vw,26px);color:#fff;touch-action:none;transform:translateY(-50%);box-shadow:0 5px 0 rgba(0,0,0,.45)}
#btnA{right:6%;background:#2f8f4e;margin-top:-5%}
#btnB{right:calc(6% + min(22vw,92px) + 10px);background:#b3302a;margin-top:8%}
.abtn:active{filter:brightness(1.25);transform:translateY(-46%)}
/* Móvil horizontal: controles flotando sobre el juego */
@media (orientation:landscape) and (max-height:520px){
  body.touch #pad{position:fixed;inset:0;height:auto;background:transparent;border:0;pointer-events:none;display:block}
  body.touch #joy,body.touch .abtn{pointer-events:auto;opacity:.72}
  #joy{left:3%;top:auto;bottom:6%;transform:none;width:min(26vh,140px);height:min(26vh,140px)}
  .abtn{top:auto;bottom:8%;transform:none;width:min(18vh,84px);height:min(18vh,84px);margin:0 !important}
  #btnA{right:3%}#btnB{right:calc(3% + min(18vh,84px) + 12px);margin-bottom:6% !important}
}
</style>
</head>
<body>
<div id="app">
  <div id="stageBox">
    <div id="stage">
      <canvas id="c" width="400" height="300"></canvas>
      <div id="hud" class="box"><span>ISLAS EXPLORADAS <span class="n" id="hudCount">0/10</span></span><span class="p" id="hudPlace"></span></div>
      <canvas id="mini" width="50" height="61"></canvas>
      <div id="sign"></div>
      <div id="prompt" class="box"></div>
      <div id="toast" class="box"></div>
      <div id="caption" class="box"></div>
      <button id="btnSkip" class="btn alt">SALTAR ▶▶</button>
      <button id="btnMute" class="btn alt" title="Sonido (M)">♪</button>

      <div id="dialog">
        <div class="top">
          <div id="dlgImgWrap"></div>
          <div id="dlgText">
            <div id="dlgBadge">EN EXHIBICIÓN</div>
            <h3 id="dlgTitle"></h3>
            <p id="dlgOrigin"></p>
            <div id="dlgDesc"></div>
          </div>
        </div>
        <div class="bottom"><button id="dlgClose" class="btn">CERRAR</button></div>
      </div>

      <div id="puzzle">
        <h3 id="pzTitle"></h3>
        <p id="pzHelp"></p>
        <div id="pzArea"></div>
        <div class="pzbot"><span id="pzMsg"></span><button id="pzSkip" class="btn alt" style="display:none">OMITIR PUZZLE</button></div>
      </div>

      <div id="finale">
        <h2 id="finTitle"></h2>
        <p id="finText"></p>
        <button id="btnKeep" class="btn">SEGUIR NAVEGANDO</button>
        <button id="btnMuseoCompleto" class="btn alt" type="button">MUSEO COMPLETO</button>
      </div>

      <div id="title">
        <h1 id="ttl"></h1>
        <p class="sub" id="sub"></p>
        <button id="btnPlay" class="btn">ZARPAR</button>
        <button id="btnNew" class="btn alt" style="display:none">NUEVO JUEGO</button>
        <div class="help">Mover: flechas / WASD o joystick<br>Acción: Espacio / Enter / E o botón A<br>Cerrar: Esc / B o botón B</div>
      </div>
      <div id="fade"></div>
    </div>
  </div>
  <div id="pad">
    <div id="joy"><div id="knob"></div></div>
    <button id="btnB" class="abtn">B</button>
    <button id="btnA" class="abtn">A</button>
  </div>
</div>

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ------------------------------ guardado ------------------------------ */
function defaultSave() { return { viewed: {}, entered: {}, restored: {}, cineDone: false }; }
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.viewed) return Object.assign(defaultSave(), s); } catch (e) { /* sin almacenamiento */ }
  return defaultSave();
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignorar */ } }
function hasProgress() { return Object.keys(save.viewed).length > 0 || Object.keys(save.entered).length > 0 || save.cineDone; }

let actx = null, muted = false;
try { muted = localStorage.getItem('islasMuseo_mute') === '1'; } catch (e) { /* */ }
function audioInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) { actx = null; }
}
function beep(f, d, type, vol, delay) {
  if (!actx || muted) return;
  try {
    const t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(vol || 0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) { /* */ }
}
const sfx = {
  ok() { beep(660, 0.08); beep(880, 0.1, 'square', 0.05, 0.07); },

  flag() { [392, 523, 659, 784, 1047].forEach((f, i) => beep(f, 0.14, 'square', 0.05, i * 0.08)); },
  thud() { beep(110, 0.18, 'sine', 0.1); },

};

// orden de los archivos: 0 espalda(N) 1 diag.tras.der(NE) 2 lateral der(E) 3 diag.front.der(SE)

const SHIP = SHIP_SRC.map((src) => { const im = new Image(); im.src = src; return im; });
const SHIP_MAP = [2, 3, 4, 5, 6, 7, 0, 1]; // índice = round(ángulo/45°) mod 8 (0 = este)
function dirIndex(vx, vy) { const k = Math.round(Math.atan2(vy, vx) / (Math.PI / 4)); return SHIP_MAP[((k % 8) + 8) % 8]; }
function drawShip(g, dir, x, y, scale, bob) {
  const im = SHIP[dir]; if (!im || !im.complete || !im.naturalWidth) return;
  const s = 64 * scale;
  g.fillStyle = 'rgba(0,0,0,0.22)';
  g.fillRect(Math.round(x - 15 * scale * 1.3), Math.round(y + 2 + (bob || 0)), Math.round(30 * scale * 1.3), Math.max(3, Math.round(4 * scale)));
  g.drawImage(im, Math.round(x - s / 2), Math.round(y - 44 * scale + (bob || 0)), s, s);
}

function placeName(i) {
  if (i === SKULL_I) return (DATA.calavera && DATA.calavera.nombre) || 'Isla Calavera';
  return (DATA.islas && DATA.islas[i] && DATA.islas[i].nombre) || ('Isla ' + (i + 1));
}
function islandWorks(i) { return (DATA.islas && DATA.islas[i] && DATA.islas[i].obras) || []; }

/* forma orgánica de cada isla: radio normalizado en función del ángulo */
PLACES.forEach((p, idx) => {
  const rnd = mulberry32(900 + idx * 131);
  const a = rnd() * 6.28, b = rnd() * 6.28, c = rnd() * 6.28;
  p.pa = [a, b, c];
  p.R = (th) => 0.92 + 0.12 * Math.sin(2 * th + a) + 0.09 * Math.sin(3 * th + b) + 0.06 * Math.sin(5 * th + c);
  p.ex = Math.ceil(p.rx * 1.3) + 70; p.ey = Math.ceil(p.ry * 1.3) + 70;
});
function normDist(p, x, y) {
  const dx = (x - p.pos.x) / p.rx, dy = (y - p.pos.y) / p.ry;
  const d = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
  return { dx, dy, d, th, t: d / p.R(th) };
}
function pushOut(p, pt, margin) {
  const q = normDist(p, pt.x, pt.y), d = q.d || 0.0001;
  const lim = p.R(q.th) + margin / ((p.rx + p.ry) / 2);
  if (d < lim) { const k = lim / d; pt.x = p.pos.x + q.dx * k * p.rx; pt.y = p.pos.y + q.dy * k * p.ry; return true; }
  return false;
}
function blockedAt(x, y, margin) {
  for (let i = 0; i < PLACES.length; i++) {
    const p = PLACES[i];
    if (Math.abs(x - p.pos.x) > p.rx * 1.4 + margin || Math.abs(y - p.pos.y) > p.ry * 1.4 + margin) continue;
    const q = normDist(p, x, y);
    if (q.d < p.R(q.th) + margin / ((p.rx + p.ry) / 2)) return true;
  }
  return false;
}

/* muelle: apunta (en 8 direcciones) hacia el punto de inicio */
PLACES.forEach((p) => {
  const k = Math.round(Math.atan2(START.y - p.pos.y, START.x - p.pos.x) / (Math.PI / 4)), a = k * Math.PI / 4;
  let ux = Math.round(Math.cos(a)), uy = Math.round(Math.sin(a)); const l = Math.hypot(ux, uy); ux /= l; uy /= l;
  let edge = 0; for (let s = 0; s < 800; s++) { if (normDist(p, p.pos.x + ux * s, p.pos.y + uy * s).t >= 1) { edge = s; break; } }
  p.dock = { ux, uy, edge, tip: { x: p.pos.x + ux * (edge + 46), y: p.pos.y + uy * (edge + 46) } };
  p.flagBase = { x: Math.round(p.pos.x + 24), y: Math.round(p.pos.y + 6) };
});

/* ------------------------------ arte: agua ------------------------------ */
const WATER = [0, 1].map((f) => {
  const { c, g } = mk(32, 32);
  g.fillStyle = '#2f80ba'; g.fillRect(0, 0, 32, 32);
  g.fillStyle = '#2b78b0';
  for (let i = 0; i < 6; i++) g.fillRect(Math.floor(hash2(i, 1, 5) * 28), Math.floor(hash2(i, 2, 5) * 30), 4, 2);
  g.fillStyle = '#58b0dc';
  const offs = [[3, 6], [19, 3], [11, 19], [26, 25]];
  offs.forEach((o, i) => {
    const ox = (o[0] + f * 2) % 28, oy = o[1];
    g.fillRect(ox, oy, 2, 1); g.fillRect(ox + 2, oy - 1, 3, 1); g.fillRect(ox + 5, oy, 2, 1);
  });
  return c;

const CELL = 40, GW = Math.ceil(WORLD_W / CELL), GH = Math.ceil(WORLD_H / CELL);

    open.sort((p, q) => p[0] - q[0]); const cur = open.shift(), cx = cur[1], cy = cur[2];
    if (cx === e[0] && cy === e[1]) { found = true; break; }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH || GRID[ny * GW + nx]) continue;
      const nc = cost.get(key(cx, cy)) + (dx && dy ? 1.41 : 1);

  return out;
}

function pzDesliz(area, lvl, win, say) {
  const t = [1, 2, 3, 4, 5, 6, 7, 8, 0]; let blank = 8, last = -1, moves = 0;
  const adj = (b) => { const r = []; const x = b % 3, y = Math.floor(b / 3); if (x > 0) r.push(b - 1); if (x < 2) r.push(b + 1); if (y > 0) r.push(b - 3); if (y < 2) r.push(b + 3); return r; };
  for (let i = 0; i < 26 + lvl * 16; i++) { const o = adj(blank).filter((x) => x !== last); const m = o[rint(o.length)]; t[blank] = t[m]; t[m] = 0; last = blank; blank = m; }
  if (t.every((v, i) => v === (i + 1) % 9)) { t[blank] = t[5]; t[5] = 0; blank = 5; }
  const grid = mkEl('div', 'pzgrid', '', { display: 'grid', gridTemplateColumns: 'repeat(3,auto)', gap: px(3) }), tiles = [];
  for (let i = 0; i < 9; i++) { const b = bigBtn(34, 30, '#4a6a9a', 14); b.addEventListener('click', () => move(i)); tiles.push(b); grid.appendChild(b); }
  function paint() { tiles.forEach((b, i) => { const v = t[i]; b.style.visibility = v ? 'visible' : 'hidden'; b.textContent = v || ''; b.style.background = 'hsl(' + (30 + v * 28) + ',45%,40%)'; }); }
  function move(i) { if (!adj(blank).includes(i)) { sfx.bump(); return; } t[blank] = t[i]; t[i] = 0; blank = i; moves++; sfx.ok(); paint(); say('Movimientos: ' + moves); if (t.every((v, k) => v === (k + 1) % 9)) { say('¡Mapa completo!'); setTimeout(win, 600); } }
  paint(); area.appendChild(grid); say('Ordena del 1 al 8 deslizando las piezas hacia el hueco');
  return { destroy() {}, test: { t, move: (i) => tiles[i].click(), get blank() { return blank; } } };
}

      if (this.kind === 'isla') {
        if (!this.wasExplored && isExplored(this.idx)) {
          this.wasExplored = true; sfx.win(); toast('¡ISLA EXPLORADA! ' + exploredCount() + '/' + N_ISL, 3200);
          if (allExplored()) setTimeout(() => toast('¡Exploraste las 10 islas! Algo cambia en el mar…', 4200), 3300);
        } else if (first && CFG.exigirVerTodas) {
          const rest = islandWorks(this.idx).filter((_, j) => !save.viewed[this.idx + ':' + j]).length;
          if (rest > 0) toast('Te faltan ' + rest + ' obra(s) en esta sala', 1800);
        }
      }
    });
  },
  draw() {
    const g = ctx, cx = Math.round(this.cam), oy = Math.floor((VH - HALL_H) / 2);
    g.fillStyle = this.skull ? '#0b0a14' : '#0d0b0a'; g.fillRect(0, 0, VW, VH);
    g.drawImage(this.hall, cx, 0, VW, HALL_H, 0, oy, VW, HALL_H);
    g.save(); g.translate(-cx, oy);
    // marcas de "ya vista"
    this.slots.forEach((s, i) => { if (save.viewed[s.key] && s.tipo !== 'escultura') drawCheck(g, 88 + 80 * i); });
    // antorchas entre marcos
    for (let i = 0; i <= this.slots.length; i++) {
      const x = 48 + 80 * i + 0; if (i === 0) continue; const f = Math.floor(gt * 9 + i * 3) % 3;
      g.fillStyle = '#3a2410'; g.fillRect(x - 1, 30, 3, 10); g.fillStyle = '#6b6b78'; g.fillRect(x - 3, 28, 7, 3);
      g.fillStyle = this.skull ? '#39ff9c' : '#ff9a2a'; g.fillRect(x - 2, 20 - f, 5, 9 + f); g.fillStyle = this.skull ? '#d0ffe8' : '#ffe27a'; g.fillRect(x - 1, 23 - f, 3, 5);
      g.fillStyle = this.skull ? 'rgba(57,255,156,.07)' : 'rgba(255,180,60,.09)'; g.fillRect(x - 22, 6, 44, 52);
    }
    if (this.chest) this.drawChest(g, this.chest);
    // flecha de salida
    if (Math.floor(gt * 2) % 2 === 0) { g.fillStyle = '#fff'; g.fillRect(46, 202, 4, 2); g.fillRect(45, 204, 6, 2); g.fillRect(44, 206, 8, 2); }
    // resaltado de la obra cercana
    // esculturas detrás del jugador → jugador → esculturas delante (profundidad 2.5D)
    const stat = []; this.slots.forEach((s, i) => { if (s.tipo === 'escultura') stat.push({ s, cx: 88 + 80 * i }); });
    const boxes = {};
    stat.filter((o) => PED_TOP + 12 < this.pl.y).forEach((o) => { boxes[o.cx] = drawStatue(g, o.cx, o.s); });
    drawPirate(g, this.pl.x, this.pl.y, this.pl.dir, this.pl.fr, this.skull);
    stat.filter((o) => PED_TOP + 12 >= this.pl.y).forEach((o) => { boxes[o.cx] = drawStatue(g, o.cx, o.s); });
    stat.forEach((o) => { if (save.viewed[o.s.key]) { g.fillStyle = '#39d66a'; g.fillRect(o.cx + 10, PED_TOP + 5, 2, 2); g.fillRect(o.cx + 12, PED_TOP + 3, 2, 2); g.fillRect(o.cx + 14, PED_TOP + 1, 2, 2); } });
    if (this.near && this.near.type === 'obra' && !isBlocked()) {
      g.strokeStyle = '#f0c24a'; g.lineWidth = 1; const s = this.near.s;
      if (s.tipo === 'escultura') { const b = boxes[this.near.cx] || { w: 30, h: 48 }; g.strokeRect(this.near.cx - b.w / 2 - 1.5, PED_TOP + 1 - b.h - 1.5, b.w + 3, b.h + 16); }
      else { const d = FRAME[s.fmt] || FRAME.horizontal; g.strokeRect(this.near.cx - d.w / 2 - 1.5, 50 - d.h - 1.5, d.w + 3, d.h + 12); }
    }
    g.restore();
    if (this.skull) { g.fillStyle = 'rgba(20,0,40,.18)'; g.fillRect(0, 0, VW, VH); }
  },
  drawChest(g, c) {
    const open = !CFG.exigirVerTodasEnCalavera || this.slots.every((s) => save.viewed[s.key]);
    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(c.x - 1, c.y + 14, c.w + 4, 4);
    g.fillStyle = '#5a3a1a'; g.fillRect(c.x, c.y + 4, c.w, 12); g.fillStyle = '#7a5028'; g.fillRect(c.x, c.y - 2, c.w, 8);
    g.fillStyle = '#d4a63a'; g.fillRect(c.x, c.y + 4, c.w, 2); g.fillRect(c.x + 10, c.y + 2, 4, 6); g.fillRect(c.x + 3, c.y - 2, 2, 18); g.fillRect(c.x + c.w - 5, c.y - 2, 2, 18);
    if (open) { const s = Math.floor(gt * 6) % 2; g.fillStyle = s ? '#fff6b0' : '#ffd24a'; g.fillRect(c.x + 11, c.y - 8 - s, 2, 4); g.fillRect(c.x + 9, c.y - 6 - s, 6, 1); g.fillRect(c.x - 3, c.y - 4, 1, 3); g.fillRect(c.x + c.w + 2, c.y - 5 + s, 1, 3); }
  }
};
scenes.museum = museum;

/* ----------------------------- CINEMÁTICA FINAL ----------------------------- */
const cine = {
  ship: { x: 0, y: 0, dir: 4 }, cam: { x: 0, y: 0 }, order: [], oi: 0, path: [], pi: 1, phase: 'embark', pt: 0, crate: null, done: false, wake: [], wt: 0, delivered: 0,
  flying: [], spawnT: 0, nSpawn: 0, nCrates: 1, loaded: 0, hold: 0, lastLoaded: -1,
  enter() {
    cineFlags = {}; this.done = false; this.delivered = 0; this.loaded = 0; this.flying = []; this.spawnT = 0; this.nSpawn = 0; this.hold = 0; this.lastLoaded = -1; this.oi = 0; this.crate = null; this.wake = [];
    $('hud').style.display = 'none'; $('mini').style.display = 'none'; $('btnSkip').style.display = 'none'; setPrompt(null); musicSet(MUS.cinematica);
    const sk = PLACES[SKULL_I];
    this.ship.x = sk.dock.tip.x + sk.dock.ux * 6; this.ship.y = sk.dock.tip.y + sk.dock.uy * 6; this.ship.dir = dirIndex(sk.dock.ux, sk.dock.uy);
    // islas que aún esperan sus obras, en orden de cercanía
    const left = []; for (let i = 0; i < N_ISL; i++) if (!save.restored[i]) left.push(i);
    this.total = left.reduce((n, i) => n + islandWorks(i).filter((o) => o.removida).length, 0); this.nCrates = clamp(this.total, 1, 14);
    this.order = []; let pos = { x: this.ship.x, y: this.ship.y };
    while (left.length) { let bi = 0, bd = 1e9; left.forEach((k, ii) => { const d = Math.hypot(PLACES[k].dock.tip.x - pos.x, PLACES[k].dock.tip.y - pos.y); if (d < bd) { bd = d; bi = ii; } }); const k = left.splice(bi, 1)[0]; this.order.push(k); pos = PLACES[k].dock.tip; }
    this.cam.x = clamp(this.ship.x - VW / 2, 0, WORLD_W - VW); this.cam.y = clamp(this.ship.y - VH / 2, 0, WORLD_H - VH);
    this.phase = this.order.length ? 'embark' : 'end'; this.pt = 0;
    if (this.order.length) setCaption('Embarcando las obras… 0/' + this.nCrates);
  },
  leave() { setCaption(null); $('btnSkip').style.display = 'none'; },
  startLeg() {
    const tgt = PLACES[this.order[this.oi]].dock.tip;
    this.path = findPath({ x: this.ship.x, y: this.ship.y }, { x: tgt.x, y: tgt.y }); this.pi = 1; this.phase = 'sail'; setCaption('Rumbo a: ' + placeName(this.order[this.oi]));
  },
  startPuzzle() {
    const isl = this.order[this.oi]; this.phase = 'puzzle'; setCaption('Isla «' + placeName(isl) + '»: resuelve el puzzle para devolver las obras');
    runPuzzle(Object.keys(save.restored).length, placeName(isl), () => this.solved());
  },
  solved() {
    const isl = this.order[this.oi]; save.restored[isl] = true; persist(); this.phase = 'unload'; this.pt = 0; this.crate = null; this._fl = false;
    toast('¡Las obras regresaron a «' + placeName(isl) + '»!', 3200);
  },
  deckCount() { const n = this.order.length || 1; return Math.round(clamp(this.loaded, 0, 8) * (n - this.delivered) / n); },
  update(dt) {
    const s = this.ship; this.pt += dt;
    if (this.phase === 'embark') {
      const interval = clamp(4 / this.nCrates, 0.2, 0.5); this.spawnT += dt;
      while (this.nSpawn < this.nCrates && this.spawnT >= interval) { this.spawnT -= interval; this.nSpawn++; this.flying.push({ t: 0 }); }
      this.flying.forEach((c) => { c.t += dt / 0.75; });
      this.flying.filter((c) => c.t >= 1).forEach(() => { this.loaded++; sfx.thud(); });
      this.flying = this.flying.filter((c) => c.t < 1);
      if (this.loaded !== this.lastLoaded) { this.lastLoaded = this.loaded; setCaption('Embarcando las obras… ' + this.loaded + '/' + this.nCrates); }
      if (this.loaded >= this.nCrates) { this.hold += dt; if (this.hold > 0.9) this.startLeg(); }
    } else if (this.phase === 'sail') {
      const tgt = this.path[this.pi]; const dx = tgt.x - s.x, dy = tgt.y - s.y, d = Math.hypot(dx, dy), step = 210 * dt;
      if (d <= step) { s.x = tgt.x; s.y = tgt.y; this.pi++; if (this.pi >= this.path.length) { sfx.thud(); this.startPuzzle(); } }
      else { s.x += dx / d * step; s.y += dy / d * step; s.dir = dirIndex(dx, dy); }
      this.wt -= dt; if (this.wt <= 0) { this.wake.push({ x: s.x - dx / (d || 1) * 10, y: s.y + 2, l: 1 }); this.wt = 0.06; }
    } else if (this.phase === 'unload') {
      const p = PLACES[this.order[this.oi]], t = this.pt;
      if (t < 1.0) { const u = t / 1.0, a = { x: s.x, y: s.y - 22 }, b = { x: p.pos.x, y: p.pos.y + 4 }; this.crate = { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) - Math.sin(u * Math.PI) * 46 }; }
      else if (t < 1.1) { this.crate = null; }
      else if (t < 2.1) { cineFlags[this.order[this.oi]] = (t - 1.1) / 1.0; if (!this._fl) { this._fl = true; sfx.flag(); } }
      else { cineFlags[this.order[this.oi]] = 1; this._fl = false; this.delivered++; this.oi++; if (this.oi >= this.order.length) { this.phase = 'end'; this.pt = 0; setCaption(null); } else this.startLeg(); }
      if (this.phase === 'unload') setCaption(placeName(this.order[this.oi]) + (t > 1.1 ? '  ✔  ' + (this.delivered + 1) + '/' + this.order.length : ''));
    } else if (this.phase === 'end') { if (this.pt > 1.2 && !this.done) this.finish(); }
    this.wake.forEach((w) => { w.l -= dt * 1.6; }); this.wake = this.wake.filter((w) => w.l > 0);
    const focusX = this.phase === 'end' ? WORLD_W / 2 : s.x, focusY = this.phase === 'end' ? WORLD_H / 2 : s.y;
    const tx = clamp(focusX - VW / 2, 0, WORLD_W - VW), ty = clamp(focusY - VH / 2, 0, WORLD_H - VH), k = Math.min(1, (this.phase === 'end' ? 1.5 : 5) * dt);
    this.cam.x += (tx - this.cam.x) * k; this.cam.y += (ty - this.cam.y) * k;
  },
  finish() {
    if (this.done) return; this.done = true;
    for (let i = 0; i < N_ISL; i++) { cineFlags[i] = 1; save.restored[i] = true; }
    save.cineDone = true; persist(); cineFlags = null; setCaption(null); $('btnSkip').style.display = 'none';
    $('finTitle').textContent = TXT.finalTitulo; $('finText').textContent = TXT.finalTexto;
    $('finale').style.display = 'flex'; ui.finale = true; sfx.win();
  },
  skip() { /* sin salto: hay que resolver los puzzles (con atajos: Shift+P) */ },
  draw() {
    const g = ctx, cam = { x: Math.round(this.cam.x), y: Math.round(this.cam.y) }, s = this.ship;
    drawWorld(g, cam, gt);
    this.wake.forEach((w) => { g.fillStyle = 'rgba(235,250,255,' + (w.l * 0.8).toFixed(2) + ')'; const z = 2 + Math.round((1 - w.l) * 4); g.fillRect(Math.round(w.x - cam.x - z / 2), Math.round(w.y - cam.y), z, 2); });
    const bob = Math.round(Math.sin(gt * 3)); drawShip(g, s.dir, s.x - cam.x, s.y - cam.y, 0.75, bob);
    // cajas apiladas en cubierta
    for (let i = 0; i < this.deckCount(); i++) { const cx = Math.round(s.x - cam.x - 10 + (i % 4) * 7), cy = Math.round(s.y - cam.y - 18 - Math.floor(i / 4) * 6 + bob); g.fillStyle = '#4a2f14'; g.fillRect(cx, cy, 7, 6); g.fillStyle = '#c08a4a'; g.fillRect(cx + 1, cy + 1, 5, 4); g.fillStyle = '#e0b030'; g.fillRect(cx + 1, cy + 3, 5, 1); }
    const drawCrate = (x, y) => { const cx = Math.round(x - cam.x), cy = Math.round(y - cam.y); g.fillStyle = '#5a3a1a'; g.fillRect(cx - 6, cy - 6, 12, 12); g.fillStyle = '#a87648'; g.fillRect(cx - 5, cy - 5, 10, 10); g.fillStyle = '#d4a63a'; g.fillRect(cx - 5, cy - 1, 10, 2); g.fillRect(cx - 1, cy - 5, 2, 10); };
    if (this.crate) drawCrate(this.crate.x, this.crate.y);
    // embarque: cajas que vuelan desde la boca de la Isla Calavera hasta el barco
    const sk = PLACES[SKULL_I].pos; this.flying.forEach((c) => { const u = clamp(c.t, 0, 1); drawCrate(lerp(sk.x, s.x, u), lerp(sk.y + 16, s.y - 22, u) - Math.sin(u * Math.PI) * 44); });
  }
};
scenes.cine = cine;
$('btnSkip').addEventListener('click', () => { audioInit(); if (cur === cine) cine.skip(); });
function crearBotonTerminar(texto = 'Terminar museo ✓', museo = 'nacional') {

/* ----------------------------- AUTO-DESCUBRIMIENTO DE IMÁGENES -----------------------------
   Si copias a la carpeta obras/ archivos con estos nombres, aparecen solos en la isla:
     obras/isla3_obra1.jpg, isla3_obra2.png ...        → cuadros en la pared
     obras/isla3_escultura1.png, isla3_escultura2.png   → esculturas/objetos sobre pedestal (PNG transparente)
   (Un navegador no puede "listar" una carpeta, así que el juego prueba los nombres en orden
   hasta que falta uno.) Para ponerles título y descripción, agrégalos en obras.js con esa misma ruta. */
function probe(src) {
  return new Promise((res) => {
    const im = new Image(); let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
    im.onload = () => fin(true); im.onerror = () => fin(false); setTimeout(() => fin(false), 6000); im.src = src;
  });
}
async function discoverIsland(i) {
  const isl = DATA.islas && DATA.islas[i]; if (!isl) return;
  if (!isl.obras) isl.obras = [];
  const used = new Set(isl.obras.map((o) => String(o.imagen || '').toLowerCase())), n = i + 1;
  async function chain(kind, exts, titulo, tipo) {
    for (let k = 1; k <= 40; k++) {
      let found = null;
      for (const e of exts) {
        const src = 'obras/isla' + n + '_' + kind + k + '.' + e;
        if (used.has(src.toLowerCase())) { found = 'used'; break; }
        if (await probe(src)) { found = src; break; }
      }
      if (!found) break;
      if (found === 'used') continue;
      used.add(found.toLowerCase());
      isl.obras.push({ titulo: titulo + ' ' + k, descripcion: CFG.descripcionAuto, imagen: found, removida: false, tipo, formato: 'auto' });
    }
  }
  await chain('obra', ['jpg', 'jpeg', 'png', 'webp'], 'Obra', 'cuadro');
  await chain('escultura', ['png', 'webp'], 'Escultura', 'escultura');
}
let discoveryDone = false;
const discoveryP = (CFG.autoDescubrir === false ? Promise.resolve() : Promise.all(Array.from({ length: N_ISL }, (_, i) => discoverIsland(i)))).then(() => { discoveryDone = true; refreshPlayBtn(); });
function refreshPlayBtn() {
  const b = $('btnPlay'); if (!b) return;
  b.disabled = !discoveryDone; b.style.opacity = discoveryDone ? '' : '.6';
  b.textContent = !discoveryDone ? 'CARGANDO OBRAS…' : (hasProgress() ? 'CONTINUAR' : 'ZARPAR');
}

    $('hud').style.display = 'none'; $('mini').style.display = 'none'; $('btnMute').style.display = 'block';

/* ----------------------------- atajos de prueba (config.atajos) ----------------------------- */
function cheatExploreAll() {
  for (let i = 0; i < N_ISL; i++) { save.entered[i] = true; islandWorks(i).forEach((_, j) => { save.viewed[i + ':' + j] = true; }); }
  persist(); updateHUD(); toast('[atajo] Todas las islas exploradas', 2000);
}

/* ======================================================================
   BUCLE PRINCIPAL
   ====================================================================== */
function resize() {
  const stage = $('stage'), pad = $('pad'); const touch = document.body.classList.contains('touch');
  const land = window.innerWidth > window.innerHeight;
  let padH = 0;
  if (touch && !(land && window.innerHeight <= 520)) padH = Math.round(Math.min(window.innerHeight * 0.30, 210));
  document.documentElement.style.setProperty('--padH', padH + 'px');
  const w = stage.clientWidth || VW; stage.style.setProperty('--u', (w / VW) + 'px');
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 120));

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; gt += dt; musicTick(dt);
  if (ui.dialog && (actionPressed() || backPressed())) closeDialog();
  else if (cur) { if (cur.update) cur.update(dt); }
  if (cur) cur.draw();
  endFrameInput();
  requestAnimationFrame(frame);
}
function boot() {
  resize();
  if (allExplored()) fog.alpha = 0;
  setScene('title');
  requestAnimationFrame((t) => { last = t; frame(t); });
}
window.__art = { mk, buildArrivalBG, buildHall, drawFrame, drawCheck, drawPirate, WATER, CLOUD, FLAG };
window.__juego = { openDialog, closeDialog, PZ, music, MUS, runPuzzle, PUZZLE_SEQ, finishPuzzle, get cur() { return cur; }, scenes, go, save: () => save, setScene, sea, museum, arrival, cine, ui, PLACES, FLAG, cheatExploreAll };
if (SHIP.length && SHIP.every((im) => im.complete)) boot();
else { let n = 0; SHIP.forEach((im) => { const done = () => { if (++n === SHIP.length) boot(); }; if (im.complete) done(); else { im.onload = done; im.onerror = done; } }); }
})();
