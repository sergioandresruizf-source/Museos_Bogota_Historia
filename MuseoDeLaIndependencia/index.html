<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5ead5">
  <meta name="description" content="El cronista de 1810: un juego para recorrer el Museo de la Independencia Casa del Florero y documentar sus obras.">
  <title>El cronista de 1810 · Museo de la Independencia</title>
  <link rel="stylesheet" href="./css/game.css">
  <link rel="stylesheet" href="./css/minigames.css">
</head>
<body>
  <canvas id="world" aria-label="Mapa del museo: usa las flechas para caminar y E para examinar las obras" role="img"></canvas>

  <header id="hud" class="hud" hidden></header>

  <div id="room-banner" class="room-banner" aria-live="polite"></div>

  <div class="touch-controls" aria-hidden="false">
    <div id="joystick" class="joystick" aria-label="Joystick para caminar" role="application">
      <span class="joy-ring"></span>
      <span class="joy-knob"></span>
    </div>
    <button type="button" id="action-btn" class="action-btn" aria-label="Examinar">
      <span class="action-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </span>
      <span class="action-label">Examinar</span>
    </button>
  </div>

  <section id="start-screen" class="start-screen" hidden></section>

  <div id="loading" class="loading">
    <div class="loading-card">
      <span class="eyebrow">— Museo de la Independencia</span>
      <h2>Abriendo las puertas <em>de la casa…</em></h2>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="print-root" class="print-root"></div>

  <noscript><p class="noscript">Este juego necesita JavaScript activado.</p></noscript>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
